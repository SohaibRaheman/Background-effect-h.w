<!DOCTYPE html>
<html>
    <head>
        <title>Animation</title>
        <style>
            @keyframes World2{
                0% {background-color:rgb(195, 11, 11);}
                25% {background-color:rgb(4, 40, 139);}
                50% {background-color: rgb(219, 11, 194);}
                75% {background-color:rgb(11, 198, 214);}
                100% {background-color:darkcyan;}
            }
            div{
                width:200px;
                height:200px;
                background-color:violet;
                animation-name:World2;
                animation-duration:20s;
            }
        </style>
    </head>
    <body>
        <div>World</div>
    </body>
</html>
